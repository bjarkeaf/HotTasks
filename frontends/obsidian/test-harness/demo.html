<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
:root{--background-primary:#ffffff;--background-secondary:#f6f6f6;--background-modifier-border:#e0e0e0;--background-modifier-hover:#ededed;--text-normal:#222;--text-muted:#5c5c5c;--text-faint:#999;--interactive-accent:#8a5cf5;--interactive-normal:#fff;--font-interface:Segoe UI,sans-serif;--text-accent:#8a5cf5}
body.theme-dark{color-scheme:dark;--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-border:#363636;--background-modifier-hover:#2c2c2c;--text-normal:#dadada;--text-muted:#a3a3a3;--text-faint:#666;--interactive-normal:#2a2a2a}
body{margin:0;background:var(--background-primary);color:var(--text-normal);font:13px var(--font-interface)}
#view{width:400px;height:960px;display:flex;flex-direction:column}
#view .hottasks-view{display:flex;flex-direction:column;height:100%}
</style>
</head>
<body class="theme-light">
<script>if (location.search.includes("theme=dark")) document.body.className = "theme-dark";</script>
<div id="view"></div>
<script src="dist/harness.js"></script>
</body>
</html>
